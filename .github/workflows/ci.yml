name: Validate project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build:hostinger 2>&1 | tee /tmp/clinic-build.log
      - run: npm --prefix server run test:mongo
      - name: Start disposable MongoDB replica set on GitHub runner
        run: |
          docker run --detach --name mongo-test --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec mongo-test mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 2
          done
          docker exec mongo-test mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec mongo-test mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify native MongoDB authentication and provisioning
        run: node server/mongo/integration.test.mjs 2>&1 | tee /tmp/clinic-mongo.log
        env:
          MONGODB_INTEGRATION_TEST: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DB: pushkar_test_ci
          JWT_SECRET: synthetic-ci-secret-for-disposable-tests-only
          FRONTEND_ORIGIN: https://erp.example.invalid
      - run: npm test 2>&1 | tee /tmp/clinic-tests.log
      - name: Expose validation failure details in check annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          for name in ['build', 'mongo', 'tests']:
              path = pathlib.Path(f'/tmp/clinic-{name}.log')
              if not path.exists():
                  continue
              lines = path.read_text(errors='replace').splitlines()
              failures = [line for line in lines if any(term in line.lower() for term in ['error', 'failed', 'not ok', 'cannot find', 'assertion', 'actual:', 'expected:'])]
              message = '\n'.join(failures[-25:])[-3500:] or '\n'.join(lines[-12:])[-2000:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Clinic {name} validation::{message}')
          PY
