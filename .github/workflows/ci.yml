name: Validate project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Reproduce the production-only Hostinger dependency installation
        run: npm ci --omit=dev --no-audit --no-fund
      - id: build
        run: npm run build:hostinger 2>&1 | tee /tmp/clinic-build.log
        env:
          NODE_ENV: production
      - name: Install compatibility test tooling after the production build
        run: npm ci --include=dev --no-audit --no-fund
      - name: Audit application and server dependency lockfiles
        run: |
          npm audit --package-lock-only --audit-level=moderate
          npm --prefix server audit --package-lock-only --audit-level=moderate
      - id: legacy_tests
        run: npm test 2>&1 | tee /tmp/clinic-tests.log
      - name: Expose validation failure details in check annotations
        if: failure()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.legacy_tests.outcome }}
        run: |
          python3 - <<'PY'
          import pathlib, os
          for name, outcome in [('build', os.environ['BUILD_OUTCOME']), ('tests', os.environ['TEST_OUTCOME'])]:
              if outcome != 'failure':
                  continue
              path = pathlib.Path(f'/tmp/clinic-{name}.log')
              if not path.exists():
                  continue
              lines = path.read_text(errors='replace').splitlines()
              failures = [line for line in lines if not line.lstrip().startswith(('ok ', '# Subtest:')) and any(term in line.lower() for term in ['error', 'failed', 'not ok', 'cannot find', 'assertion', 'actual:', 'expected:'])]
              message = '\n'.join(failures[-25:])[-3500:] or '\n'.join(lines[-12:])[-2000:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Clinic {name} validation::{message}')
          PY

  mongodb:
    name: Native MongoDB workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci --include=dev --no-audit --no-fund
      - run: npm --prefix server run test:mongo
      - name: Start disposable MongoDB replica set on GitHub runner
        run: |
          exec > >(tee /tmp/clinic-mongo-setup.log) 2>&1
          mkdir -p "$RUNNER_TEMP/mongodb-bin" "$RUNNER_TEMP/mongo-data"
          curl --fail --silent --show-error --location --retry 3 https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.32.tgz --output "$RUNNER_TEMP/mongodb.tgz"
          tar -xzf "$RUNNER_TEMP/mongodb.tgz" --strip-components=1 -C "$RUNNER_TEMP/mongodb-bin"
          "$RUNNER_TEMP/mongodb-bin/bin/mongod" --dbpath "$RUNNER_TEMP/mongo-data" --replSet rs0 --bind_ip 127.0.0.1 --port 27017 --wiredTigerCacheSizeGB 0.25 --fork --logpath /tmp/clinic-mongod.log
          node server/mongo/ci-replica.mjs
      - name: Verify native MongoDB authentication and provisioning
        run: node server/mongo/integration.test.mjs 2>&1 | tee /tmp/clinic-mongo.log
        env:
          MONGODB_INTEGRATION_TEST: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DB: pushkar_test_ci
          JWT_SECRET: synthetic-ci-secret-for-disposable-tests-only
          FRONTEND_ORIGIN: https://erp.example.invalid
          CRM_INTEGRATION_ENABLED: 'true'
          CRM_API_BASE_URL: https://crm.example.invalid/api
          GROQ_API_KEY: synthetic-provider-key-used-only-with-mocked-fetch
      - name: Report MongoDB integration failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          for name in ['setup', 'server', 'integration']:
              path = pathlib.Path({'setup':'/tmp/clinic-mongo-setup.log','server':'/tmp/clinic-mongod.log','integration':'/tmp/clinic-mongo.log'}[name])
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  failures = [i for i,line in enumerate(lines) if 'not ok ' in line]
                  content = '\n'.join(line for i in failures for line in lines[max(0,i-1):i+23])[-6000:] if name == 'integration' and failures else '\n'.join(lines[-40:])[-6000:]
                  escaped = content.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print(f'::error title=MongoDB {name}::{escaped}')
          PY
      - name: Build frontend for native managed-hosting validation
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build
      - name: Verify native managed-hosting entry point
        run: node server/mongo/hosting-smoke.mjs
        env:
          MONGODB_INTEGRATION_TEST: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DB: pushkar_test_hosting
          JWT_SECRET: synthetic-ci-secret-for-disposable-tests-only
          FRONTEND_ORIGIN: https://erp.example.invalid
