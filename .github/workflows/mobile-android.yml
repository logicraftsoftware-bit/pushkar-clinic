name: Patient Android APK
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compilation tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build standalone internal testing APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --build-cache --info --stacktrace || ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --build-cache --refresh-dependencies --info --stacktrace
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JibonCare-patient-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
